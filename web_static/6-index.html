<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AirBnB clone - Web static</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles/4-common.css">
    <link rel="stylesheet" href="styles/3-header.css">
    <link rel="stylesheet" href="styles/3-footer.css">
    <link rel="stylesheet" href="styles/6-filters.css">
  </head>
  <body>
    <header>
      <div class="logo">airbnb</div>
    </header>
    <div class="container">
      <section class="filters">
        <div class="locations">
          <h3>States</h3>
          <h4>Fake State, Fake City, Fake Place</h4>
          <ul class="popover">
            <li>
              <h2>Fake State 1</h2>
              <ul>
                <li>Fake City 1</li>
                <li>Fake City 2</li>
                <li>Fake City 3</li>
              </ul>
            </li>
            <li>
              <h2>Fake State 2</h2>
              <ul>
                <li>Fake City 4</li>
                <li>Fake City 5</li>
              </ul>
            </li>
          </ul>
        </div>
        <div class="amenities">
          <h3>Amenities</h3>
          <h4>Wifi, Pool, Parking, Kitchen</h4>
          <ul class="popover">
            <li>Wifi</li>
            <li>Pool</li>
            <li>Parking</li>
            <li>Kitchen</li>
          </ul>
        </div>
        <button>Search</button>
      </section>
    </div>
    <footer>
      <p>Best School</p>
    </footer>
  </body>
</html>
